<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Messenger</title>
    <link rel="stylesheet" href="/converse/dist/converse.min.css">

    <script src="https://cdn.conversejs.org/12.0.0/dist/locales/ru-LC_MESSAGES-converse-po.js"></script>

    <script src="/converse/dist/converse.min.js"></script>
    <style>
        body { margin: 0; padding: 0; height: 100vh; overflow: hidden; }
        #conversejs { height: 100vh; }
    </style>
</head>

<body>
    <div id="conversejs"></div>
    <script src="https://cdn.conversejs.org/12.0.0/dist/converse.min.js"></script>
    <script>
        converse.initialize({
            websocket_url: `wss://${window.location.host}/xmpp-websocket`,
            authentication: 'login',
            keepalive: true,
            view_mode: 'fullscreen',
            allow_registration: true,
            omemo_default: true,
            trusted: false,
            show_controlbox_by_default: true,
            allow_contact_requests: true,
            sounds_path: '/converse/dist/sounds/',
            play_sounds: true,
            allow_contact_removal: true,
            allow_logout: true,
            message_archiving: 'always',
            message_receipts: true, 
            allow_message_retraction: 'all',
            allow_message_corrections: 'all',
            allow_muc_invitations: true,
            send_chat_markers: true,  
            archived_messages_page_size: 50,
            loglevel: 'warn',
            theme: 'dracula',
            i18n: window.__ru_locale
        });
    </script>
    <script>
        const observer = new MutationObserver(() => {
            const jidInput  = document.querySelector('input[name="jid"]');
            const passInput = document.querySelector('input[type="password"]');
            const form      = document.querySelector('form');

            if (jidInput && passInput && form) {
                jidInput.setAttribute('autocomplete', 'username');
                passInput.setAttribute('autocomplete', 'current-password');
                form.setAttribute('autocomplete', 'on');
                observer.disconnect();
            }
        });

        observer.observe(document.body, { childList: true, subtree: true });
    </script>
</body>
</html>
