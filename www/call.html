<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Звонок</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { margin:0; background:#111; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; color:#fff; font-family:sans-serif; }
    video { width:45vw; max-width:640px; border-radius:8px; background:#000; }
    #videos { display:flex; gap:16px; }
    #status { margin-top:16px; font-size:14px; opacity:0.7; }
    button { margin-top:24px; padding:12px 32px; background:#e53935; color:#fff; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="videos">
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>
  <div id="status">Подключение к серверу...</div>
  <button onclick="hangup()">Завершить</button>

  <script>
    const params   = new URLSearchParams(location.search);
    const roomId   = params.get('room');
    const isInit   = params.get('initiator') === '1';

    // Инициатор регистрируется как roomId + '-caller'
    // Получатель регистрируется как roomId + '-receiver'
    const myPeerId     = roomId + (isInit ? '-caller' : '-receiver');
    const remotePeerId = roomId + (isInit ? '-receiver' : '-caller');

    const peer = new Peer(myPeerId, {
    host: location.hostname,
    path: '/',          
    secure: true,
    port: 443,
      config: {
        iceServers: [
          { urls: 'stun:' + location.hostname + ':3478' },
          { urls: 'turn:' + location.hostname + ':3478', username: roomId, credential: roomId }
        ]
      }
    });

    let localStream, currentCall;

    peer.on('error', err => {
      document.getElementById('status').textContent = 'Ошибка: ' + err.message;
      console.error(err);
    });

    navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
      localStream = stream;
      document.getElementById('localVideo').srcObject = stream;

      peer.on('open', (id) => {
        console.log('PeerJS connected, my ID:', id);
        document.getElementById('status').textContent = isInit ? 'Вызов...' : 'Ожидание звонка...';

        if (isInit) {
          // Инициатор ждёт 2с чтобы получатель успел подключиться, затем звонит
          setTimeout(() => {
            console.log('Calling:', remotePeerId);
            currentCall = peer.call(remotePeerId, stream);
            if (!currentCall) {
              document.getElementById('status').textContent = 'Не удалось дозвониться';
              return;
            }
            currentCall.on('stream', remote => {
              document.getElementById('remoteVideo').srcObject = remote;
              document.getElementById('status').textContent = 'Звонок активен';
            });
            currentCall.on('error', err => {
              document.getElementById('status').textContent = 'Ошибка звонка: ' + err.message;
            });
          }, 2000);
        } else {
          // Получатель ждёт входящий звонок
          peer.on('call', call => {
            console.log('Incoming call from:', call.peer);
            currentCall = call;
            call.answer(stream);
            call.on('stream', remote => {
              document.getElementById('remoteVideo').srcObject = remote;
              document.getElementById('status').textContent = 'Звонок активен';
            });
          });
        }
      });
    }).catch(err => {
      document.getElementById('status').textContent = 'Нет доступа к камере/микрофону: ' + err.message;
    });

    function hangup() {
      currentCall?.close();
      localStream?.getTracks().forEach(t => t.stop());
      peer.destroy();
      window.close();
    }
  </script>
</body>
</html>
