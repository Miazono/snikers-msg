services:
  nginx:
    image: nginx:alpine
    container_name: xmpp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    command: /bin/sh -c "envsubst '$$DOMAIN' < /etc/nginx/conf.d/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf.template:ro
      - ./www:/var/www/html:ro
      - ./certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - prosody
    networks:
      - xmpp-net

  prosody:
    image: prosody/prosody:latest
    container_name: xmpp-prosody
    restart: unless-stopped
    ports:
      - "5222:5222"   # C2S
      - "5269:5269"   # S2S
    volumes:
      - ./prosody/prosody.cfg.lua:/etc/prosody/prosody.cfg.lua:ro
      - prosody-data:/var/lib/prosody
      - ./certs:/etc/letsencrypt:ro
    environment:
      - LOCAL=${PROSODY_ADMIN_USER:-admin}
      - DOMAIN=${DOMAIN}
      - PASSWORD=${PROSODY_ADMIN_PASS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - xmpp-net
    healthcheck:
      test: ["CMD", "prosodyctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: xmpp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: prosody
      POSTGRES_USER: prosodyuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - xmpp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prosodyuser -d prosody"]
      interval: 10s
      timeout: 5s
      retries: 5

  certbot:
    image: certbot/certbot
    container_name: xmpp-certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    networks:
      - xmpp-net

volumes:
  prosody-data:
  postgres-data:
  certbot-webroot:

networks:
  xmpp-net:
    driver: bridge